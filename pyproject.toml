[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visiontrack"
version = "0.1.0"
description = "Traffic detection, tracking, and analytics pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python-headless",
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
